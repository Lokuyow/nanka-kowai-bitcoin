<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>(function(){var t='light';try{var s=localStorage.getItem('theme');if(s==='dark'||s==='light'){t=s;}else if(window.matchMedia('(prefers-color-scheme: dark)').matches){t='dark';}}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<meta name="theme-color" content="#fffaf3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1d1611" media="(prefers-color-scheme: dark)">
<title>ページが見つかりません：なんか よくわからんけど こわい ビットコイン</title>
<meta name="description" content="お探しのページは見つかりませんでした。">
<link rel="icon" type="image/svg+xml" href="/nanka-kowai-bitcoin/favicon.svg">
<style>
  :root{
    --ink:#1a1a1a; --sub:#666; --orange:#f7931a; --bg:#fffaf3;
    --card:#fff;--btnbg:#1a1a1a;--btnfg:#fff;--amber:#c77400; --line:#e8e0d4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.7}
  .wrap{max-width:640px;margin:0 auto;padding:20px 18px 64px}
  header{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
  header b{color:var(--ink)}
  h1{font-size:30px;line-height:1.35;margin:48px 0 8px}
  .lede{color:var(--sub);font-size:14px;margin:0 0 28px}
  .btn{display:inline-block;background:var(--btnbg);color:var(--btnfg);text-decoration:none;
    border-radius:999px;padding:12px 26px;font-size:15px;font-weight:700}
</style>
<style>
  :root[data-theme="dark"]{color-scheme:dark;
    --ink:#f3ecdf; --sub:#b3a48d; --bg:#1d1611;
    --card:#2b211a; --line:#4d3e2f; --red:#ff7a66; --green:#7fc784;
    --btnbg:#f3ecdf; --btnfg:#241a10; --amber:#f0a63f}
  .head-right{display:flex;align-items:center;gap:10px}
  .theme-toggle{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:50%;
    background:transparent;color:var(--sub);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center}
  .theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .theme-toggle .ic-sun{display:none}
  :root[data-theme="dark"] .theme-toggle .ic-sun{display:block}
  :root[data-theme="dark"] .theme-toggle .ic-moon{display:none}
</style>
</head>
<body>
<div class="wrap">
<header><span><b>なんか よくわからんけど<br>こわい ビットコイン</b></span><span class="head-right"><button class="theme-toggle" type="button" aria-label="ダークモードに切り替える" aria-pressed="false"><svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M19.8 4.2l-1.6 1.6M5.8 18.2l-1.6 1.6"/></svg></button></span></header>
<h1>ページが見つかりません</h1>
<p class="lede">アドレスが変わったか、入力が間違っているかもしれません。全23話はトップページから読めます。</p>
<a class="btn" href="https://lokuyow.github.io/nanka-kowai-bitcoin/">トップへもどる</a>
</div>

<script>
(function(){
  var btn = document.querySelector('.theme-toggle');
  if (!btn) return;
  var root = document.documentElement;
  function sync(){
    var dark = root.getAttribute('data-theme') === 'dark';
    btn.setAttribute('aria-label', dark ? 'ライトモードに切り替える' : 'ダークモードに切り替える');
    btn.setAttribute('aria-pressed', dark ? 'true' : 'false');
  }
  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
    sync();
  });
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  function onChange(e){
    var saved = null;
    try { saved = localStorage.getItem('theme'); } catch (err) {}
    if (saved !== 'dark' && saved !== 'light') {
      root.setAttribute('data-theme', e.matches ? 'dark' : 'light');
      sync();
    }
  }
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  sync();
})();
</script>
</body>
</html>
