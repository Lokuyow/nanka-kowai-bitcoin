<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fffaf3">
<script>(function(){var p='system';try{var s=localStorage.getItem('theme');if(s==='light'||s==='dark'||s==='system'){p=s;}}catch(e){}var t=p;if(p==='system'){t='light';try{if(window.matchMedia('(prefers-color-scheme: dark)').matches){t='dark';}}catch(e){}}var r=document.documentElement;r.setAttribute('data-theme',t);r.setAttribute('data-theme-pref',p);var m=document.querySelector('meta[name="theme-color"]');if(m){m.setAttribute('content',t==='dark'?'#171614':'#fffaf3');}})();</script>
<script>(function(){var l='ja';try{var s=localStorage.getItem('lang');if(s==='en'||s==='ja'){l=s;}else if((navigator.language||'').toLowerCase().indexOf('en')===0){l='en';}}catch(e){}document.documentElement.setAttribute('data-lang',l);document.documentElement.setAttribute('lang',l);})();</script>
<script src="/nanka-kowai-bitcoin/i18n.js"></script>
<title>ページが見つかりません：なんか よくわからんけど こわい ビットコイン</title>
<meta name="description" content="お探しのページは見つかりませんでした。">
<link rel="icon" type="image/svg+xml" href="/nanka-kowai-bitcoin/favicon.svg">
<link rel="manifest" href="/nanka-kowai-bitcoin/manifest.webmanifest">
<link rel="apple-touch-icon" href="/nanka-kowai-bitcoin/icons/apple-touch-icon.png">
<style>
  :root{
    --ink:#1a1a1a; --sub:#666; --orange:#f7931a; --bg:#fffaf3;
    --card:#fff;--btnbg:#1a1a1a;--btnfg:#fff;--amber:#c77400; --line:#e8e0d4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;line-height:1.7}
  .wrap{max-width:640px;margin:0 auto;padding:0 18px 64px}
  header{font-size:13px;color:var(--sub);display:flex;justify-content:space-between;align-items:center}
  header{position:sticky;top:0;z-index:60;margin:0 -18px;padding:10px 18px;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  header b{color:var(--ink);white-space:nowrap}
  h1{font-size:30px;line-height:1.35;margin:48px 0 8px}
  .lede{color:var(--sub);font-size:14px;margin:0 0 28px}
  .btn{display:inline-block;background:var(--btnbg);color:var(--btnfg);text-decoration:none;
    border-radius:999px;padding:12px 26px;font-size:15px;font-weight:700}
</style>
<style>
  :root[data-theme="dark"]{color-scheme:dark;
    --ink:#f3ecdf; --sub:#b3a48d; --bg:#171614;
    --card:#242322; --line:#43413c; --red:#ff7a66; --green:#7fc784;
    --btnbg:#f3ecdf; --btnfg:#1d1c1a; --amber:#f0a63f}
  .head-right{display:flex;align-items:center;gap:10px;white-space:nowrap}
  .theme-toggle{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:50%;
    background:transparent;color:var(--sub);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center}
  .theme-toggle svg{width:20px;height:20px;fill:none;stroke:currentColor;
    stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .theme-toggle .ic-sun,.theme-toggle .ic-moon,.theme-toggle .ic-sys{display:none}
  :root[data-theme-pref="light"] .theme-toggle .ic-sun{display:block}
  :root[data-theme-pref="dark"] .theme-toggle .ic-moon{display:block}
  :root[data-theme-pref="system"] .theme-toggle .ic-sys{display:block}
  :focus-visible{outline:3px solid var(--orange);outline-offset:2px}
</style>
<style>
  .lang-toggle{flex:0 0 auto;height:38px;padding:0 12px;border-radius:999px;
    background:transparent;color:var(--sub);border:1px solid var(--line);
    display:flex;align-items:center;gap:5px;font-size:12.5px;line-height:1}
  .lang-toggle .lg-ja,.lang-toggle .lg-en{opacity:.5}
  :root[data-lang="ja"] .lang-toggle .lg-ja,
  :root[data-lang="en"] .lang-toggle .lg-en{opacity:1;color:var(--ink);font-weight:700}

  @media(max-width:520px){
    header{font-size:12px}
    .head-right{gap:8px}
  }
</style>
</head>
<body>
<div class="wrap">
<header><span><a href="/nanka-kowai-bitcoin/"><b data-i18n-html>なんか よくわからんけど<br>こわい ビットコイン</b></a></span><span class="head-right"><button class="theme-toggle" type="button" aria-label="テーマ：端末に合わせる（次はライト）" aria-pressed="false"><svg class="ic-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg><svg class="ic-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2.2M12 19.8V22M2 12h2.2M19.8 12H22M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M19.8 4.2l-1.6 1.6M5.8 18.2l-1.6 1.6"/></svg><svg class="ic-sys" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor" stroke="none"/></svg></button><button class="lang-toggle" type="button" aria-label="英語に切り替える" aria-pressed="false"><span class="lg-ja">日本語</span><span class="lg-en">EN</span></button></span></header>
<h1 data-i18n>ページが見つかりません</h1>
<p class="lede" data-i18n>アドレスが変わったか、入力が間違っているかもしれません。全23話はトップページから読めます。</p>
<a class="btn" href="https://lokuyow.github.io/nanka-kowai-bitcoin/" data-i18n>トップへもどる</a>
</div>

<script>
(function(){
  var L = window.L || function (ja) { return ja; };
  var btn = document.querySelector('.theme-toggle');
  if (!btn) return;
  var root = document.documentElement;
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var ORDER = ['system', 'light', 'dark'];
  var LABELS = {
    system: ['テーマ：端末に合わせる（次はライト）', 'Theme: match device (tap for light)'],
    light: ['テーマ：ライト（次はダーク）', 'Theme: light (tap for dark)'],
    dark: ['テーマ：ダーク（次は端末に合わせる）', 'Theme: dark (tap for system)']
  };
  function pref(){
    try { var s = localStorage.getItem('theme'); if (s === 'light' || s === 'dark' || s === 'system') return s; } catch (e) {}
    return 'system';
  }
  function apply(){
    var p = pref();
    var t = p === 'system' ? (mq.matches ? 'dark' : 'light') : p;
    root.setAttribute('data-theme', t);
    root.setAttribute('data-theme-pref', p);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', t === 'dark' ? '#171614' : '#fffaf3');
    btn.setAttribute('aria-label', L(LABELS[p][0], LABELS[p][1]));
    btn.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
  }
  btn.addEventListener('click', function(){
    var next = ORDER[(ORDER.indexOf(pref()) + 1) % ORDER.length];
    try { localStorage.setItem('theme', next); } catch (e) {}
    apply();
  });
  if (mq.addEventListener) mq.addEventListener('change', function(){ if (pref() === 'system') apply(); });
  document.addEventListener('langchange', apply);
  apply();
})();
</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('/nanka-kowai-bitcoin/sw.js').catch(function(){});});}</script>
</body>
</html>
