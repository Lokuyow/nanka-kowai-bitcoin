name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global "$(node -p 'require("./package.json").packageManager')"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Verify deployment
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          base="${PAGES_URL%/}"
          curl --fail --location --silent --show-error --retry 4 --output /dev/null "$base/"
          curl --fail --location --silent --show-error --retry 4 --output /dev/null "$base/price/"
          status=$(curl --silent --show-error --retry 4 --output /dev/null --write-out '%{http_code}' "$base/__pages-smoke__/missing/")
          test "$status" = 404
