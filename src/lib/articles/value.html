<div class="answer" data-i18n-html>ビットコインには金や円との交換保証がない。<br>それでも欲しい人と売る人がいれば価格はつく</div>

  <section>
    <h2 data-i18n>なぜそう見えるか</h2>
    <p class="lede" data-i18n>円は支払いに広く使え、金には宝飾品などの用途がある。では、ビットコインを買う人は何に価値を感じるのだろう？ たとえば、銀行を介さずに送金できることに価値を感じる人がいる。</p>
  </section>

  <section>
    <h2 data-i18n>買いたい人の多さと出回る量</h2>
    <p class="lede" data-i18n>買いたい人が増えたり、出回る量が減ったりすると、値段はどうなる？ 2つのスライダーを動かして確かめよう。</p>
    <div class="card">
      <div class="tlbtns" role="group" aria-label="ものの切り替え" data-i18n-label>
        <button type="button" data-item="stone" class="on" data-i18n>ただの石ころ</button>
        <button type="button" data-item="gold" data-i18n>金（ゴールド）</button>
        <button type="button" data-item="btc" data-i18n>ビットコイン</button>
      </div>
      <div class="sliders">
        <label><span data-i18n>買いたい人の多さ</span><input type="range" id="slWant" min="0" max="100" value="10" aria-label="買いたい人の多さ" data-i18n-label></label>
        <label><span data-i18n>出回る量の少なさ</span><input type="range" id="slScarce" min="0" max="100" value="20" aria-label="出回る量の少なさ" data-i18n-label></label>
      </div>
      <div class="meterwrap">
        <div class="meterlabel" data-i18n>価格のイメージ</div>
        <div class="meter"><div class="meterfill" id="meterFill"></div></div>
        <div class="meternum"><span id="meterNum">0</span><span style="font-size:14px;color:var(--sub)"> / 100</span></div>
      </div>
      <p class="evtmsg" id="evtMsg" aria-live="polite"></p>
      <p class="labmsg" id="labMsg" aria-live="polite"></p>
      <div class="center"><button type="button" id="btnEvent" data-i18n>事件を起こす</button></div>
    </div>
  </section>
<div class="summary"><small data-i18n>一言まとめ</small><span data-i18n>金や円との交換保証がなくても、買い手がいて取引が成立すれば価格はつく</span></div>
